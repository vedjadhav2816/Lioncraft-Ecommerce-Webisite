{% extends 'base.html' %}
{% load static %}

{% block title %}AI Design Generator{% endblock %}

{% block styles %}
<style>
   
/* Premium Card Styling */
.premium-card {
  background: #1a1a1a; /* Deep black background */
  border: 4px solid #d4af37; /* Gold border */
  border-radius: 16px;
  box-shadow: 0 6px 25px rgba(0, 0, 0, 0.6), 0 0 15px rgba(212, 175, 55, 0.3); /* Subtle gold glow */
  transition: transform 0.4s ease, box-shadow 0.4s ease;
  overflow: hidden;
}

.premium-card:hover {
  transform: translateY(-10px);
  box-shadow: 0 12px 35px rgba(212, 175, 55, 0.8); /* Enhanced gold glow on hover */
}

/* Image Wrapper */
.premium-img-wrapper {
  width: 100%;
  height: 300px; /* Fixed height for consistency */
  display: flex;
  align-items: center;
  justify-content: center;
  background: #2b2e33; /* Dark gray background */
  border-bottom: 3px solid #d4af37; /* Gold accent */
  border-radius: 14px 14px 0 0;
  overflow: hidden;
  position: relative;
}

.premium-img-wrapper::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: radial-gradient(circle, rgba(212, 175, 55, 0.2), transparent 70%); /* Subtle gold glow */
  pointer-events: none;
}

/* Card Image */
.premium-img {
  width: 100%;
  height: 100%;
  object-fit: contain; /* Ensures image fits nicely */
  padding: 1rem;
  transition: transform 0.4s ease;
}

.premium-img:hover {
  transform: scale(1.05); /* Slight zoom on hover */
}

/* Card Body */
.premium-card-body {
  padding: 1.5rem;
  color: #ffffff; /* White text */
  background: #1a1a1a; /* Matches card background */
}

/* Card Text */
.premium-text {
  font-size: 1rem;
  margin-bottom: 1rem;
  word-break: break-word;
  line-height: 1.5;
}

.premium-text strong {
  color: #ffd700; /* Bright gold for emphasis */
}

.premium-date {
  color: #94a3b8 !important; /* Muted gray for date */
  font-size: 0.85rem;
}

/* Form Elements */
.premium-input,
.premium-select {
  background: rgba(255, 255, 255, 0.08); /* Semi-transparent white */
  border: 3px solid #d4af37; /* Gold border */
  color: #ffffff; /* White text */
  padding: 0.75rem;
  border-radius: 12px;
  transition: all 0.4s ease;
  height: 45px;
}

.premium-input:focus,
.premium-select:focus {
  border-color: #ffd700; /* Brighter gold on focus */
  background: rgba(255, 255, 255, 0.12);
  box-shadow: 0 0 20px rgba(212, 175, 55, 0.8); /* Glowing effect */
  outline: none;
}

.premium-input::placeholder {
  color: #94a3b8; /* Muted placeholder text */
}

/* Buttons */
.premium-btn {
  padding: 0.75rem 1.5rem;
  border-radius: 12px;
  transition: all 0.4s ease;
  position: relative;
  overflow: hidden;
}

.premium-btn-success {
  border: 3px solid #2e8b57; /* Emerald green border */
  color: #2e8b57;
  background: transparent;
}

.premium-btn-success:hover {
  background: linear-gradient(45deg, #2e8b57, #3cb371); /* Green gradient */
  color: #ffffff;
  border-color: #3cb371;
  box-shadow: 0 6px 20px rgba(46, 139, 87, 0.7); /* Green glow */
}

.premium-btn-danger {
  border: 3px solid #dc3545; /* Red border */
  color: #dc3545;
  background: transparent;
}

.premium-btn-danger:hover {
  background: linear-gradient(45deg, #dc3545, #ff4d4f); /* Red gradient */
  color: #ffffff;
  border-color: #ff4d4f;
  box-shadow: 0 6px 20px rgba(220, 53, 69, 0.7); /* Red glow */
}
/* Premium Container Styling */
.premium-container {
  background: linear-gradient(145deg, #1a1a1a 0%, #2b2e33 100%); /* Dark gradient background */
  border: 2px solid #d4af37; /* Gold border */
  border-radius: 12px;
  padding: 2rem;
  box-shadow: 0 0 20px rgba(212, 175, 55, 0.3); /* Subtle gold glow */
}

/* Premium Title Styling */
.premium-title {
  color: #d4af37; /* Gold text */
  text-shadow: 0 0 10px rgba(212, 175, 55, 0.5); /* Glowing effect */
  border-bottom: 1px solid #d4af37; /* Gold underline */
  padding-bottom: 0.5rem;
}

/* Premium Input Styling */
.premium-input {
  background: #2b2e33; /* Dark background */
  border: 2px solid #d4af37; /* Gold border */
  color: #ffffff; /* White text */
  padding: 1rem;
  border-radius: 8px;
  transition: border-color 0.3s ease, box-shadow 0.3s ease;
}

.premium-input:focus {
  border-color: #ffd700; /* Brighter gold on focus */
  box-shadow: 0 0 10px rgba(212, 175, 55, 0.5); /* Glowing effect */
  outline: none;
}

.premium-input::placeholder {
  color: #d4af37; /* Gold placeholder text */
  opacity: 0.7;
}

/* Premium Button Styling */
.premium-btn {
  background: linear-gradient(45deg, #d4af37, #ffd700); /* Gold gradient */
  border: none;
  color: #1a1a1a; /* Dark text for contrast */
  font-weight: 600;
  padding: 0.75rem 1.5rem;
  border-radius: 8px;
  transition: all 0.3s ease;
}

.premium-btn:hover {
  background: linear-gradient(45deg, #ffd700, #d4af37); /* Reverse gradient on hover */
  box-shadow: 0 0 15px rgba(212, 175, 55, 0.6); /* Glowing effect */
}

/* Premium Loader Styling */
.premium-loader {
  color: #d4af37; /* Gold text */
  font-size: 1.2rem;
  animation: pulse 1.5s infinite; /* Pulsing animation */
}

/* Pulse Animation for Loader */
@keyframes pulse {
  0% { opacity: 1; }
  50% { opacity: 0.5; }
  100% { opacity: 1; }
}
/* Input Field Styling */
.form-control {
  background: #2b2e33; /* Dark, premium background */
  border: 2px solid #d4af37; /* Elegant gold border */
  color: #ffffff; /* White text for contrast */
  padding: 1rem;
  border-radius: 8px;
  transition: border-color 0.3s ease, box-shadow 0.3s ease;
}

.form-control:focus {
  border-color: #ffd700; /* Brighter gold when focused */
  box-shadow: 0 0 10px rgba(212, 175, 55, 0.5); /* Subtle glow effect */
  outline: none;
}

.form-control::placeholder {
  color: #d4af37; /* Gold placeholder text */
  opacity: 0.7;
}

/* Button Styling */
.btn.btn-primary {
  background: linear-gradient(45deg, #d4af37, #ffd700); /* Luxurious gold gradient */
  border: none;
  color: #1a1a1a; /* Dark text for readability */
  font-weight: 600;
  padding: 0.75rem 1.5rem;
  border-radius: 8px;
  transition: all 0.3s ease;
}

.btn.btn-primary:hover {
  background: linear-gradient(45deg, #ffd700, #d4af37); /* Gradient reversal on hover */
  box-shadow: 0 0 15px rgba(212, 175, 55, 0.6); /* Glow effect */
  transform: translateY(-3px); /* Slight lift for depth */
}

/* Loader Styling */
.text-info {
  color: #d4af37 !important; /* Gold text for premium feel */
  font-size: 1.2rem;
  animation: pulse 1.5s infinite; /* Pulsing animation */
}

/* Pulse Animation for Loader */
@keyframes pulse {
  0% { opacity: 1; }
  50% { opacity: 0.5; }
  100% { opacity: 1; }
}
</style>
{% endblock %}
{% block content %}
<div class="container my-5">
  <h2 class="mb-4">🎨 Generate Your AI T-shirt Design</h2>

  <!-- Prompt input -->
  <input type="text" id="prompt" class="form-control mb-3" placeholder="Describe your T-shirt design (e.g. neon lion on dark background)" />
  <button id="generateBtn" class="btn btn-primary mb-4" onclick="generateDesign()">Generate Design</button>

  <!-- Loader -->
  <div id="loader" class="mb-3 text-info" style="display: none;">⏳ Generating design, please wait...</div>

  <!-- Preview Section -->
  <div id="previewSection" style="display: none;">
    <img id="designPreview" src="" alt="AI Design" class="img-fluid mb-3 rounded shadow" style="max-width: 100%; height: auto;" />

    <!-- Add to Cart Form -->
    <form method="POST" action="{% url 'add_ai_cart' %}">
      {% csrf_token %}
      <div class="mb-2">
        <input type="text" name="custom_name" class="form-control" placeholder="Name your design" required />
      </div>
      <input type="hidden" id="custom_image_url" name="custom_image_url" required />

      <div class="mb-2">
        <label>Size:
          <select name="size" class="form-select">
            <option value="S">S</option>
            <option value="M" selected>M</option>
            <option value="L">L</option>
            <option value="XL">XL</option>
            <option value="XXL">XXL</option>
          </select>
        </label>
      </div>

      <div class="mb-2">
        <label>Quantity:
          <input type="number" name="quantity" class="form-control" value="1" min="1" />
        </label>
      </div>

      <button type="submit" class="btn btn-success">Add to Cart</button>
      
    </form>
    <button type="button" class="btn btn-danger" onclick="deleteDesign()">Delete Design</button>
  </div>

  <!-- Design History -->
  <div id="historySection" class="mt-5">
    <h4>🕘 Your Design History</h4>
    <div id="historyList" class="row mt-3"></div>
  </div>
</div>

<!-- JavaScript -->
<script>
  function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== "") {
      const cookies = document.cookie.split(";");
      for (let cookie of cookies) {
        cookie = cookie.trim();
        if (cookie.startsWith(name + "=")) {
          cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
          break;
        }
      }
    }
    return cookieValue;
  }

  async function generateDesign() {
    const prompt = document.getElementById("prompt").value.trim();
    const loader = document.getElementById("loader");
    const preview = document.getElementById("previewSection");
    const img = document.getElementById("designPreview");
    const imgInput = document.getElementById("custom_image_url");
    const btn = document.getElementById("generateBtn");

    if (!prompt) {
      alert("⚠️ Please enter a design prompt.");
      return;
    }

    loader.style.display = "block";
    preview.style.display = "none";
    btn.disabled = true;
    btn.innerText = "Generating...";

    try {
      const response = await fetch("/products/ai-design/generate/", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-CSRFToken": getCookie("csrftoken"),
        },
        body: JSON.stringify({ prompt })
      });

      const data = await response.json();
      loader.style.display = "none";
      btn.disabled = false;
      btn.innerText = "Generate Design";

      if (data.success && data.image) {
        img.src = data.image;
        imgInput.value = data.image;
        preview.style.display = "block";
        saveToHistory(prompt, data.image);
        renderHistory();
      } else {
        alert("❌ Failed to generate image: " + (data.error || "Unknown error."));
      }
    } catch (err) {
      console.error("Fetch error:", err);
      loader.style.display = "none";
      btn.disabled = false;
      btn.innerText = "Generate Design";
      alert("❌ Error generating design.");
    }
  }

  function saveToHistory(prompt, imageUrl) {
    const history = JSON.parse(localStorage.getItem("designHistory")) || [];
    history.unshift({
      prompt: prompt,
      imageUrl: imageUrl,
      date: new Date().toLocaleString()
    });
    if (history.length > 10) history.pop();
    localStorage.setItem("designHistory", JSON.stringify(history));
  }

  function renderHistory() {
    const history = JSON.parse(localStorage.getItem("designHistory")) || [];
    const container = document.getElementById("historyList");
    container.innerHTML = "";

    if (history.length === 0) {
      container.innerHTML = "<p class='text-muted'>No designs yet. Start creating!</p>";
      return;
    }

    history.forEach((item, index) => {
      const col = document.createElement("div");
      col.className = "col-md-4 mb-4";
col.innerHTML = `
  <div class="card shadow-sm h-100 premium-card">
    <div class="card-img-wrapper premium-img-wrapper">
      <img src="${item.imageUrl}" class="card-img-top premium-img" alt="Design ${index + 1}">
    </div>
    <div class="card-body premium-card-body">
      <p class="card-text premium-text"><strong>Prompt:</strong> ${item.prompt}</p>
      <p class="text-muted small premium-date">🕒 ${item.date}</p>

      <form method="POST" action="{% url 'add_ai_cart' %}">
        <input type="hidden" name="csrfmiddlewaretoken" value="${getCookie('csrftoken')}">

        <div class="mb-2">
          <input type="text" name="custom_name" class="form-control premium-input" placeholder="T-shirt Name" required>
        </div>

        <input type="hidden" name="custom_image_url" value="${item.imageUrl}" required>

        <div class="mb-2">
          <select name="size" class="form-select premium-select" required>
            <option value="S">S</option>
            <option value="M" selected>M</option>
            <option value="L">L</option>
            <option value="XL">XL</option>
            <option value="XXL">XXL</option>
          </select>
        </div>

        <div class="mb-2">
          <input type="number" name="quantity" class="form-control premium-input" value="1" min="1" required>
        </div>

        <input type="hidden" name="price" value="600">

        <button type="submit" class="btn btn-sm btn-outline-success w-100 premium-btn premium-btn-success">Add to Cart</button>
      </form>
      <!-- Delete Button -->
      <button class="btn btn-sm btn-outline-danger w-100 mt-2 premium-btn premium-btn-danger" onclick="deleteDesign(${index})">Delete</button>
    </div>
  </div>
`;
      container.appendChild(col);
    });
  }

  window.onload = () => {
    renderHistory();
  };
  
  function deleteDesign(index) {
  // Show the loader when the delete button is clicked
  document.getElementById("loader").style.display = "flex";

  // Simulate the deletion process with a timeout
  setTimeout(() => {
    // Retrieve the design history from localStorage
    const history = JSON.parse(localStorage.getItem("designHistory")) || [];

    // Remove the design at the specified index
    history.splice(index, 1);

    // Save the updated history back to localStorage
    localStorage.setItem("designHistory", JSON.stringify(history));

    // Re-render the history after deletion
    renderHistory();

    // Hide the loader after the deletion is complete
    document.getElementById("loader").style.display = "none";
  }, 1500); // Simulate loading delay for 1.5 seconds (adjust as needed)
}

</script>
{% endblock %}

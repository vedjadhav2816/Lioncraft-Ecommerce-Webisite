{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <h2 class="text-center">Edit Product</h2>
    <div class="card p-4 shadow">
        
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }}">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <input type="hidden" name="prod_id" value="{{ product.id }}">

            <!-- Category -->
            <div class="mb-3">
                <label for="id_category" class="form-label">Category</label>
                <select name="category" id="id_category" class="form-control">
                    <option value="Premium" {% if product.category == "Premium" %}selected{% endif %}>Premium</option>
                    <option value="Accessories" {% if product.category == "Accessories" %}selected{% endif %}>Accessories</option>
                    <option value="T-Shirts" {% if product.category == "T-Shirts" %}selected{% endif %}>T-Shirts</option>
                </select>
            </div>

            <!-- Product Name -->
            <div class="mb-3">
                <label for="id_name" class="form-label">Product Name</label>
                <input type="text" name="name" id="id_name" class="form-control" value="{{ product.name }}" required>
            </div>

            <!-- Description -->
            <div class="mb-3">
                <label for="id_description" class="form-label">Description</label>
                <textarea name="description" id="id_description" class="form-control" rows="3" required>{{ product.description }}</textarea>
            </div>

            <!-- Price INR -->
            <div class="mb-3">
                <label for="id_price_inr" class="form-label">Price (INR)</label>
                <input type="number" name="price_inr" id="id_price_inr" class="form-control" value="{{ product.price_inr }}" required>
            </div>

            <!-- Price USD -->
            <div class="mb-3">
                <label for="id_price_usd" class="form-label">Price (USD)</label>
                <input type="number" name="price_usd" id="id_price_usd" class="form-control" value="{{ product.price_usd }}" required>
            </div>

            <!-- Images Section -->
            <div class="row">
                <!-- Main Image -->
                <div class="col-md-4 mb-3">
                    <label for="id_image1" class="form-label">Main Image</label>
                    <input type="file" name="image1" id="id_image1" class="form-control">
                    {% if product.image1 %}
                        <img src="{{ product.image1.url }}" alt="Current Image" class="img-thumbnail mt-2" width="120">
                    {% endif %}
                </div>

                <!-- Additional Image 1 -->
                <div class="col-md-4 mb-3">
                    <label for="id_image2" class="form-label">Additional Image 1</label>
                    <input type="file" name="image2" id="id_image2" class="form-control">
                    {% if product.image2 %}
                        <img src="{{ product.image2.url }}" alt="Current Image" class="img-thumbnail mt-2" width="120">
                    {% endif %}
                </div>

                <!-- Additional Image 2 -->
                <div class="col-md-4 mb-3">
                    <label for="id_image3" class="form-label">Additional Image 2</label>
                    <input type="file" name="image3" id="id_image3" class="form-control">
                    {% if product.image3 %}
                        <img src="{{ product.image3.url }}" alt="Current Image" class="img-thumbnail mt-2" width="120">
                    {% endif %}
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100">Save Changes</button>
        </form>
    </div>
</div>
{% endblock %}
